apiVersion: apps/v1
kind: Deployment
metadata:
  name: managed
  managedFields:
    - apiVersion: apps/v1
      fieldsType: FieldsV1
      fieldsV1:
        f:spec:
          f:replicas: {}
      manager: kube-controller-manager
      operation: Update
spec:
  replicas: 2
  selector:
    matchLabels:
      app: managed
  template:
    metadata:
      labels:
        app: managed
    spec:
      containers:
        - name: app
          image: example/app:v1
