[tools]
go = "1.26.5"
golangci-lint = "2.12.2"
lefthook = "2.1.10"
oras = "1.3.3"
shellcheck = "0.11.0"
zizmor = "1.28.0"
hugo = "0.164.0"

[tasks.fmt]
description = "Run go fmt against Go code"
run = "go fmt ./..."

[tasks.test]
description = "Run Go tests"
run = "go test ./..."

[tasks.test-race]
description = "Run Go tests with the race detector"
run = "go test -race ./..."

[tasks.coverage]
description = "Generate and print Go coverage summary"
run = "go test ./... -coverprofile=coverage.txt -covermode=atomic && go tool cover -func=coverage.txt"

[tasks.vet]
description = "Run go vet"
run = "go vet ./..."

[tasks.lint]
description = "Run golangci-lint"
run = "golangci-lint run --allow-parallel-runners"

[tasks.lint-fix]
description = "Run golangci-lint with fixes"
run = "golangci-lint run --allow-parallel-runners --fix"

[tasks.mod-verify]
description = "Verify module downloads"
run = "go mod verify"

[tasks.mod-tidy-check]
description = "Check go.mod and go.sum are tidy"
run = "go mod tidy && git diff --exit-code go.mod go.sum"

[tasks.markdownlint]
description = "Lint Markdown files"
run = "go run github.com/shinagawa-web/gomarklint/v3@v3.3.0"

[tasks.actionlint]
description = "Lint GitHub Actions workflows"
run = "go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12"

[tasks.shellcheck]
description = "Lint shell scripts"
run = "shellcheck setup-action/*.sh pr-action/*.sh scripts/profile-smoke.sh scripts/argocd-parity-smoke.sh scripts/install-drydock.sh"

[tasks.vuln]
description = "Run advisory govulncheck"
run = "go run golang.org/x/vuln/cmd/govulncheck@v1.1.4 ./..."

[tasks.whitespace]
description = "Check for whitespace errors in changed lines"
run = "git diff --check"

[tasks.docs-serve]
description = "Serve the Hugo documentation site locally"
run = "hugo server --source site --disableFastRender"

[tasks.docs-build]
description = "Build the Hugo documentation site into site/public"
run = "hugo --source site --destination public"

[tasks.docs-check]
description = "Build the Hugo documentation site into a temporary directory"
run = "hugo --source site --destination /tmp/drydock-docs-site --cleanDestinationDir --minify"

[tasks.zizmor]
description = "Audit GitHub Actions workflow security"
run = "zizmor .github/workflows setup-action pr-action"

[tasks.hooks-install]
description = "Install optional local lefthook hooks"
run = "lefthook install"

[tasks.ci]
description = "Run the main local CI checks"
depends = ["mod-verify", "mod-tidy-check", "test-race", "vet", "lint", "markdownlint", "docs-check", "actionlint", "shellcheck", "zizmor", "whitespace"]
