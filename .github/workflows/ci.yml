---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  detect:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      docs: ${{ steps.paths.outputs.docs }}
      docs-site: ${{ steps.paths.outputs.docs-site }}
      go: ${{ steps.paths.outputs.go }}
      image: ${{ steps.paths.outputs.image }}
      lint: ${{ steps.paths.outputs.lint }}
      render-parity-smoke: ${{ steps.render_parity_smoke.outputs.run }}
      renovate: ${{ steps.paths.outputs.renovate }}
      workflow: ${{ steps.paths.outputs.workflow }}
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Detect changed paths
        id: paths
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4.0.1
        with:
          filters: |
            docs:
              - '**/*.md'
            docs-site:
              - 'docs/**'
              - 'schemas/**'
              - 'site/**'
              - 'mise.lock'
              - 'mise.toml'
            go:
              - '**/*.go'
              - '**/testdata/**'
              - 'go.mod'
              - 'go.sum'
              - 'mise.lock'
              - 'mise.toml'
              - 'schemas/**'
              - 'scripts/**'
            image:
              - '.dockerignore'
              - 'Dockerfile'
              - '**/*.go'
              - 'go.mod'
              - 'go.sum'
            lint:
              - '.golangci.yml'
              - '.gomarklint.json'
              - 'lefthook.yml'
              - 'mise.lock'
              - 'mise.toml'
            renovate:
              - '.github/renovate.json5'
            workflow:
              - '.github/workflows/**'
              - 'pr-action/**'
              - 'setup-action/**'

      - name: Detect Argo CD render parity smoke relevance
        id: render_parity_smoke
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          EVENT_NAME: ${{ github.event_name }}
        shell: bash
        run: |
          run_smoke="false"
          reason="not a pull request"

          if [[ "${EVENT_NAME}" == "pull_request" ]]; then
            changed_files="$(git diff --name-only "${BASE_SHA}...HEAD")"

            if grep -Eq '^(\.github/workflows/argocd-parity-smoke\.yml|internal/app/|internal/diagnostic/|internal/paritycompare/|internal/project/|scripts/argocd-parity-compare/|scripts/argocd-project-policy-smoke/|scripts/argocd-parity-smoke\.sh|testdata/argocd-parity/|testdata/argocd-project-policy/)' <<<"${changed_files}"; then
              run_smoke="true"
              reason="render parity, project policy, or diagnostic files changed"
            elif grep -qx 'go.mod' <<<"${changed_files}"; then
              go_mod_diff="$(git diff --unified=0 "${BASE_SHA}...HEAD" -- go.mod)"
              semantic_modules='(github\.com/argoproj/argo-cd/v3|github\.com/argoproj/argo-cd/gitops-engine|github\.com/google/go-jsonnet|helm\.sh/helm/|k8s\.io/|sigs\.k8s\.io/controller-runtime|sigs\.k8s\.io/json|sigs\.k8s\.io/kustomize/|sigs\.k8s\.io/structured-merge-diff/|sigs\.k8s\.io/yaml)'
              if grep -Eq "^[+-][[:space:]]*((require|replace)[[:space:]]+)?${semantic_modules}\\b" <<<"${go_mod_diff}"; then
                run_smoke="true"
                reason="semantic rendering module changed"
              fi
            fi
          fi

          echo "run=${run_smoke}" >> "${GITHUB_OUTPUT}"
          echo "reason=${reason}" >> "${GITHUB_OUTPUT}"
          echo "Argo CD render parity smoke: ${run_smoke} (${reason})"

  go-test:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.go == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          install_args: --locked

      - name: Verify dependencies
        run: mise run mod-verify

      - name: Check go.mod tidiness
        run: mise run mod-tidy-check

      - name: Test with race detector
        run: mise run test-race

      - name: Vet
        run: mise run vet

  go-lint:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.go == 'true' || needs.detect.outputs.lint == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          install_args: --locked

      - name: Lint Go
        run: mise run lint

  markdownlint:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.docs == 'true' || needs.detect.outputs.lint == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          install_args: --locked

      - name: Lint Markdown
        run: mise run markdownlint

  docs-site:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.docs-site == 'true' || needs.detect.outputs.workflow == 'true' || needs.detect.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          install_args: --locked

      - name: Build documentation site
        run: mise run docs-check

  workflow-lint:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.workflow == 'true' || needs.detect.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          install_args: --locked

      - name: Lint GitHub Actions
        run: mise run actionlint

      - name: Audit GitHub Actions security
        run: mise run zizmor

  shellcheck:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.workflow == 'true' || needs.detect.outputs.lint == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@dba19683ed58901619b14f395a24841710cb4925 # v4.1.0
        with:
          experimental: true
          install_args: --locked

      - name: Lint shell scripts
        run: mise run shellcheck

  renovate:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.renovate == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Validate Renovate config
        run: npx --yes --package renovate@43.150.0 -- renovate-config-validator --strict

  whitespace:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            if [ "$before" = "0000000000000000000000000000000000000000" ] || \
              ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --check "$empty_tree" HEAD
            else
              git diff --check "$before..HEAD"
            fi
          fi

  image:
    needs: detect
    if: github.event_name != 'pull_request' || needs.detect.outputs.image == 'true' || needs.detect.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify distroless base image
        shell: bash
        run: |
          distroless_ref="$(awk '/^FROM gcr.io\/distroless\// {print $2}' Dockerfile)"
          if [[ -z "${distroless_ref}" ]]; then
            echo "No distroless base image found in Dockerfile" >&2
            exit 1
          fi

          cosign verify "${distroless_ref}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=drydock-ci
          cache-to: type=gha,scope=drydock-ci,mode=max,ignore-error=true

  argocd-render-parity-smoke:
    needs: detect
    if: needs.detect.outputs.render-parity-smoke == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/argocd-parity-smoke.yml

  gate:
    if: always()
    needs:
      - detect
      - go-test
      - go-lint
      - markdownlint
      - docs-site
      - workflow-lint
      - shellcheck
      - renovate
      - whitespace
      - image
      - argocd-render-parity-smoke
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: Evaluate results
        env:
          DETECT: ${{ needs.detect.result }}
          GO_TEST: ${{ needs.go-test.result }}
          GO_LINT: ${{ needs.go-lint.result }}
          MARKDOWNLINT: ${{ needs.markdownlint.result }}
          DOCS_SITE: ${{ needs.docs-site.result }}
          WORKFLOW_LINT: ${{ needs.workflow-lint.result }}
          SHELLCHECK: ${{ needs.shellcheck.result }}
          RENOVATE: ${{ needs.renovate.result }}
          WHITESPACE: ${{ needs.whitespace.result }}
          IMAGE: ${{ needs.image.result }}
          ARGOCD_RENDER_PARITY_SMOKE: ${{ needs.argocd-render-parity-smoke.result }}
        run: |
          echo "detect=${DETECT} go-test=${GO_TEST} go-lint=${GO_LINT} markdownlint=${MARKDOWNLINT} docs-site=${DOCS_SITE} workflow-lint=${WORKFLOW_LINT} shellcheck=${SHELLCHECK} renovate=${RENOVATE} whitespace=${WHITESPACE} image=${IMAGE} argocd-render-parity-smoke=${ARGOCD_RENDER_PARITY_SMOKE}"

          for result in \
            "${DETECT}" \
            "${GO_TEST}" \
            "${GO_LINT}" \
            "${MARKDOWNLINT}" \
            "${DOCS_SITE}" \
            "${WORKFLOW_LINT}" \
            "${SHELLCHECK}" \
            "${RENOVATE}" \
            "${WHITESPACE}" \
            "${IMAGE}" \
            "${ARGOCD_RENDER_PARITY_SMOKE}"; do
            if [[ "${result}" != "success" && "${result}" != "skipped" ]]; then
              echo "CI failed: job returned ${result}"
              exit 1
            fi
          done

          echo "CI passed"
