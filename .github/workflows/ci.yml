---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          experimental: true
          install_args: --locked

      - name: Verify dependencies
        run: mise run mod-verify

      - name: Check go.mod tidiness
        run: mise run mod-tidy-check

      - name: Test
        run: mise run test

      - name: Vet
        run: mise run vet

      - name: Lint Go
        run: mise run lint

      - name: Lint Markdown
        run: mise run markdownlint

      - name: Lint GitHub Actions
        run: mise run actionlint

      - name: Audit GitHub Actions security
        run: mise run zizmor

      - name: Diff check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            if [ "$before" = "0000000000000000000000000000000000000000" ] || \
              ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --check "$empty_tree" HEAD
            else
              git diff --check "$before..HEAD"
            fi
          fi
