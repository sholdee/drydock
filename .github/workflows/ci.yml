---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: CI

on:
  pull_request:
    types:
      - opened
      - ready_for_review
      - reopened
      - synchronize
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          experimental: true
          install_args: --locked

      - name: Verify dependencies
        run: mise run mod-verify

      - name: Check go.mod tidiness
        run: mise run mod-tidy-check

      - name: Test
        run: mise run test

      - name: Vet
        run: mise run vet

      - name: Lint Go
        run: mise run lint

      - name: Lint Markdown
        run: mise run markdownlint

      - name: Lint GitHub Actions
        run: mise run actionlint

      - name: Audit GitHub Actions security
        run: mise run zizmor

      - name: Diff check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            if [ "$before" = "0000000000000000000000000000000000000000" ] || \
              ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --check "$empty_tree" HEAD
            else
              git diff --check "$before..HEAD"
            fi
          fi

  image:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify distroless base image
        shell: bash
        run: |
          distroless_ref="$(awk '/^FROM gcr.io\/distroless\// {print $2}' Dockerfile)"
          if [[ -z "${distroless_ref}" ]]; then
            echo "No distroless base image found in Dockerfile" >&2
            exit 1
          fi

          cosign verify "${distroless_ref}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@d7f5e7f509e45cec5c76c4d5afdd7de93d0b3df5 # v4.1.0

      - name: Build image
        uses: docker/build-push-action@f9f3042f7e2789586610d6e8b85c8f03e5195baf # v7.2.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=ci
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=drydock-ci
          cache-to: type=gha,scope=drydock-ci,mode=max,ignore-error=true
