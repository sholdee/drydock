---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Argo CD Render Parity Smoke

on:
  workflow_dispatch:
  workflow_call:

concurrency:
  group: argocd-parity-smoke-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@1648a7812b9aeae629881980618f079932869151 # v4.0.1
        with:
          experimental: true
          install_args: --locked

      - name: Set up kubectl
        uses: Azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.1

      - name: Create kind cluster
        uses: helm/kind-action@ef37e7f390d99f746eb8b610417061a60e82a6cc # v1.14.0
        with:
          version: v0.31.0
          kubectl_version: v1.36.1
          cluster_name: drydock-argocd-parity-smoke
          wait: 120s

      - name: Build drydock
        run: go build -trimpath -o dist/drydock ./cmd/drydock

      - name: Run Argo CD render parity smoke
        run: >-
          scripts/argocd-parity-smoke.sh
          --binary ./dist/drydock
          --out "${RUNNER_TEMP}/argocd-parity-smoke"
          --cluster-name drydock-argocd-parity-smoke
          --existing-cluster

      - name: Upload parity artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: argocd-parity-smoke
          path: |
            ${{ runner.temp }}/argocd-parity-smoke/argocd-manifests
            ${{ runner.temp }}/argocd-parity-smoke/drydock-manifests
            ${{ runner.temp }}/argocd-parity-smoke/compare
            ${{ runner.temp }}/argocd-parity-smoke/logs
          if-no-files-found: ignore
