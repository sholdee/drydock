---
# yaml-language-server: $schema=https://json.schemastore.org/github-workflow.json
name: Release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  release-meta:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      bookkeep: ${{ steps.version.outputs.bookkeep }}
      created: ${{ steps.version.outputs.created }}
      publish: ${{ steps.version.outputs.publish }}
      semver: ${{ steps.version.outputs.semver }}
      tag: ${{ steps.version.outputs.tag }}
    steps:
      - name: Verify release ref
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" != "refs/heads/main" ]]; then
            echo "Release publishing must run from refs/heads/main; got ${GITHUB_REF}." >&2
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          version="$(jq -r '."."' .release-please-manifest.json)"
          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid release version in .release-please-manifest.json: ${version}" >&2
            exit 1
          fi

          tag="v${version}"
          created="$(git show -s --format=%cI "${GITHUB_SHA}")"
          bookkeep="false"
          publish="true"
          remote_sha="$(git ls-remote --tags origin "refs/tags/${tag}" | awk 'NR == 1 { print $1 }')"

          if release_draft="$(gh release view "${tag}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            publish="false"
            if [[ "${release_draft}" == "true" ]]; then
              if [[ -n "${remote_sha}" && "${remote_sha}" != "${GITHUB_SHA}" ]]; then
                echo "Draft release ${tag} exists, but its tag points to ${remote_sha}, expected ${GITHUB_SHA}." >&2
                exit 1
              fi
              publish="true"
            elif [[ -n "${remote_sha}" && "${remote_sha}" == "${GITHUB_SHA}" ]]; then
              bookkeep="true"
            fi
          fi

          {
            echo "bookkeep=${bookkeep}"
            echo "created=${created}"
            echo "publish=${publish}"
            echo "semver=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  source-go-test:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Verify dependencies
        run: mise run mod-verify

      - name: Check go.mod tidiness
        run: mise run mod-tidy-check

      - name: Test with race detector
        run: mise run test-race

      - name: Vet
        run: mise run vet

  source-go-lint:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Lint Go
        run: mise run lint

  source-markdownlint:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Lint Markdown
        run: mise run markdownlint

  source-docs-site:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Build documentation site
        run: mise run docs-check

  source-workflow-lint:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Lint GitHub Actions
        run: mise run actionlint

      - name: Audit GitHub Actions security
        run: mise run zizmor

  source-shellcheck:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup mise
        uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4.2.5
        with:
          experimental: true
          install_args: --locked

      - name: Lint shell scripts
        run: mise run shellcheck

  source-whitespace:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Diff check
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git diff --check "${{ github.event.pull_request.base.sha }}...HEAD"
          else
            before="${{ github.event.before }}"
            empty_tree="4b825dc642cb6eb9a060e54bf8d69288fbee4904"
            if [ "$before" = "0000000000000000000000000000000000000000" ] || \
              ! git cat-file -e "$before^{commit}" 2>/dev/null; then
              git diff --check "$empty_tree" HEAD
            else
              git diff --check "$before..HEAD"
            fi
          fi

  source-checks:
    needs:
      - release-meta
      - source-docs-site
      - source-go-lint
      - source-go-test
      - source-markdownlint
      - source-shellcheck
      - source-whitespace
      - source-workflow-lint
    if: always() && needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Verify source checks
        env:
          SOURCE_DOCS_SITE: ${{ needs.source-docs-site.result }}
          SOURCE_GO_LINT: ${{ needs.source-go-lint.result }}
          SOURCE_GO_TEST: ${{ needs.source-go-test.result }}
          SOURCE_MARKDOWNLINT: ${{ needs.source-markdownlint.result }}
          SOURCE_SHELLCHECK: ${{ needs.source-shellcheck.result }}
          SOURCE_WHITESPACE: ${{ needs.source-whitespace.result }}
          SOURCE_WORKFLOW_LINT: ${{ needs.source-workflow-lint.result }}
        shell: bash
        run: |
          failed="false"
          for check in \
            "source-docs-site=${SOURCE_DOCS_SITE}" \
            "source-go-lint=${SOURCE_GO_LINT}" \
            "source-go-test=${SOURCE_GO_TEST}" \
            "source-markdownlint=${SOURCE_MARKDOWNLINT}" \
            "source-shellcheck=${SOURCE_SHELLCHECK}" \
            "source-whitespace=${SOURCE_WHITESPACE}" \
            "source-workflow-lint=${SOURCE_WORKFLOW_LINT}"; do
            name="${check%%=*}"
            result="${check#*=}"
            echo "${name}: ${result}"
            if [[ "${result}" != "success" ]]; then
              failed="true"
            fi
          done

          if [[ "${failed}" == "true" ]]; then
            echo "One or more release source checks failed." >&2
            exit 1
          fi

  binaries:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false

      - name: Install Syft
        uses: anchore/sbom-action/download-syft@aa80c8c5bd439a416a62804f2151ab38c671a638 # v0.24.1

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Create local release tag
        env:
          TAG: ${{ needs.release-meta.outputs.tag }}
        shell: bash
        run: git tag --force "${TAG}" "${GITHUB_SHA}"

      - name: Build release artifacts
        uses: goreleaser/goreleaser-action@f06c13b6b1a9625abc9e6e439d9c05a8f2190e94 # v7.2.3
        with:
          distribution: goreleaser
          version: "~> v2"
          args: release --clean --skip=publish
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload release artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-artifacts
          path: dist/
          retention-days: 1

  image:
    needs:
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify distroless base image
        shell: bash
        run: |
          distroless_ref="$(awk '/^FROM gcr.io\/distroless\// {print $2}' Dockerfile)"
          if [[ -z "${distroless_ref}" ]]; then
            echo "No distroless base image found in Dockerfile" >&2
            exit 1
          fi

          cosign verify "${distroless_ref}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Build image
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: false
          build-args: |
            VERSION=${{ needs.release-meta.outputs.tag }}
            COMMIT=${{ github.sha }}
          cache-from: type=gha,scope=drydock
          cache-to: type=gha,scope=drydock,mode=max,ignore-error=true

  argocd-render-parity-smoke:
    needs:
      - binaries
      - release-meta
    if: needs.release-meta.outputs.publish == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/argocd-parity-smoke.yml
    with:
      drydock_archive_name: drydock_linux-amd64.tar.gz
      drydock_artifact_name: release-artifacts

  stage-release:
    needs:
      - argocd-render-parity-smoke
      - binaries
      - image
      - release-meta
      - source-checks
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-id: ${{ steps.stage.outputs.release-id }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Download release artifacts
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-artifacts
          path: dist/

      - name: Stage draft release
        id: stage
        env:
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-meta.outputs.tag }}
          VERSION: ${{ needs.release-meta.outputs.semver }}
        shell: bash
        run: |
          remote_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')"

          if existing_release_draft="$(gh release view "${TAG}" --json isDraft --jq '.isDraft' 2>/dev/null)"; then
            if [[ "${existing_release_draft}" != "true" ]]; then
              echo "Release ${TAG} already exists and is not a draft." >&2
              exit 1
            fi
            gh release delete "${TAG}" --yes
          fi

          if [[ -n "${remote_sha}" ]]; then
            git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ":refs/tags/${TAG}"
            git tag --delete "${TAG}" 2>/dev/null || true
          fi

          awk -v version="${VERSION}" '
            $0 ~ "^## \\[?" version "\\]?" {
              emit = 1
              next
            }
            emit && /^## / {
              exit
            }
            emit {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              --jq '.body' > release-notes.md
          fi

          {
            printf "\n---\n\n"
            printf "**Validation:** Argo CD render parity smoke passed for release artifacts.\n"
            printf "**Container image:** \`%s:%s\`\n" "${FULL_IMAGE}" "${TAG}"
            printf "**Checksums:** \`checksums.txt\`\n"
          } >> release-notes.md

          mapfile -d '' release_assets < <(find dist -maxdepth 1 -type f -print0 | sort -z)
          if [[ "${#release_assets[@]}" -eq 0 ]]; then
            echo "No release artifacts found in dist/" >&2
            exit 1
          fi

          required_assets=(
            checksums.txt
            drydock_darwin-amd64.tar.gz
            drydock_darwin-arm64.tar.gz
            drydock_linux-amd64.tar.gz
            drydock_linux-arm64.tar.gz
          )
          for required_asset in "${required_assets[@]}"; do
            if [[ ! -f "dist/${required_asset}" ]]; then
              echo "Missing required release artifact: ${required_asset}" >&2
              exit 1
            fi
          done

          for required_archive in \
            drydock_darwin-amd64.tar.gz \
            drydock_darwin-arm64.tar.gz \
            drydock_linux-amd64.tar.gz \
            drydock_linux-arm64.tar.gz; do
            if ! grep -Eq "[[:space:]]${required_archive}$" dist/checksums.txt; then
              echo "checksums.txt does not contain ${required_archive}" >&2
              exit 1
            fi
          done

          gh release create "${TAG}" "${release_assets[@]}" \
            --draft \
            --target "${GITHUB_SHA}" \
            --title "${TAG}" \
            --notes-file release-notes.md

          release_id="$(gh release view "${TAG}" --json databaseId --jq '.databaseId')"
          release_target="$(gh release view "${TAG}" --json targetCommitish --jq '.targetCommitish')"
          if [[ -z "${release_id}" ]]; then
            echo "Failed to resolve draft release ID for ${TAG}." >&2
            exit 1
          fi
          if [[ "${release_target}" != "${GITHUB_SHA}" ]]; then
            echo "Draft release ${TAG} points to ${release_target}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi
          echo "release-id=${release_id}" >> "${GITHUB_OUTPUT}"

  publish-image:
    needs:
      - release-meta
      - stage-release
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
      packages: write
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify distroless base image
        shell: bash
        run: |
          distroless_ref="$(awk '/^FROM gcr.io\/distroless\// {print $2}' Dockerfile)"
          if [[ -z "${distroless_ref}" ]]; then
            echo "No distroless base image found in Dockerfile" >&2
            exit 1
          fi

          cosign verify "${distroless_ref}" \
            --certificate-oidc-issuer https://accounts.google.com \
            --certificate-identity keyless@distroless.iam.gserviceaccount.com

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image
        id: build
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:${{ needs.release-meta.outputs.tag }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          build-args: |
            VERSION=${{ needs.release-meta.outputs.tag }}
            COMMIT=${{ github.sha }}
          annotations: |
            index:org.opencontainers.image.description=Inspect your Argo CD fleet without getting wet
            index:org.opencontainers.image.source=https://github.com/${{ github.repository }}
            index:org.opencontainers.image.licenses=Apache-2.0
          labels: |
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.release-meta.outputs.tag }}
            org.opencontainers.image.created=${{ needs.release-meta.outputs.created }}
          cache-from: type=gha,scope=drydock
          cache-to: type=gha,scope=drydock,mode=max,ignore-error=true

      - name: Sign image tags
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          TAG: ${{ needs.release-meta.outputs.tag }}
        run: |
          cosign sign --yes "${FULL_IMAGE}:${TAG}@${DIGEST}"
          cosign sign --yes "${FULL_IMAGE}:latest@${DIGEST}"

  homebrew-tap-preflight:
    needs:
      - release-meta
    if: >-
      needs.release-meta.outputs.publish == 'true' ||
      needs.release-meta.outputs.bookkeep == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      default-branch: ${{ steps.branch.outputs.default-branch }}
    steps:
      - name: Resolve Homebrew tap branch
        id: branch
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          if [[ -z "${HOMEBREW_TAP_TOKEN}" ]]; then
            echo "HOMEBREW_TAP_TOKEN is required to publish drydock releases and update sholdee/homebrew-tap." >&2
            exit 1
          fi

          default_branch="$(gh api repos/sholdee/homebrew-tap --jq '.default_branch')"
          if [[ -z "${default_branch}" ]]; then
            echo "Failed to resolve sholdee/homebrew-tap default branch." >&2
            exit 1
          fi

          echo "default-branch=${default_branch}" >> "${GITHUB_OUTPUT}"

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sholdee/homebrew-tap
          ref: ${{ steps.branch.outputs.default-branch }}
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      - name: Verify Homebrew tap push access
        env:
          DEFAULT_BRANCH: ${{ steps.branch.outputs.default-branch }}
          GIT_TERMINAL_PROMPT: "0"
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        shell: bash
        run: |
          git -C tap push --dry-run \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/sholdee/homebrew-tap.git" \
            "HEAD:refs/heads/${DEFAULT_BRANCH}"

  publish-release:
    needs:
      - homebrew-tap-preflight
      - publish-image
      - release-meta
      - stage-release
    if: needs.release-meta.outputs.publish == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Publish draft release
        env:
          DIGEST: ${{ needs.publish-image.outputs.digest }}
          FULL_IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_ID: ${{ needs.stage-release.outputs.release-id }}
          TAG: ${{ needs.release-meta.outputs.tag }}
          VERSION: ${{ needs.release-meta.outputs.semver }}
        shell: bash
        run: |
          if [[ -z "${RELEASE_ID}" ]]; then
            echo "stage-release did not provide a release ID." >&2
            exit 1
          fi

          release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/${RELEASE_ID}")"
          release_draft="$(jq -r '.draft' <<< "${release_json}")"
          release_tag="$(jq -r '.tag_name' <<< "${release_json}")"
          release_target="$(jq -r '.target_commitish' <<< "${release_json}")"
          if [[ "${release_draft}" != "true" ]]; then
            echo "Release ${RELEASE_ID} is not an unpublished draft." >&2
            exit 1
          fi
          if [[ "${release_tag}" != "${TAG}" ]]; then
            echo "Release ${RELEASE_ID} tag is ${release_tag}, expected ${TAG}." >&2
            exit 1
          fi
          if [[ "${release_target}" != "${GITHUB_SHA}" ]]; then
            echo "Release ${RELEASE_ID} target is ${release_target}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi

          awk -v version="${VERSION}" '
            $0 ~ "^## \\[?" version "\\]?" {
              emit = 1
              next
            }
            emit && /^## / {
              exit
            }
            emit {
              print
            }
          ' CHANGELOG.md > release-notes.md

          if [[ ! -s release-notes.md ]]; then
            gh api "repos/${GITHUB_REPOSITORY}/releases/generate-notes" \
              -f tag_name="${TAG}" \
              --jq '.body' > release-notes.md
          fi

          {
            printf "\n---\n\n"
            printf "**Validation:** Argo CD render parity smoke passed for release artifacts.\n"
            printf "**Container image:** \`%s:%s@%s\`\n" "${FULL_IMAGE}" "${TAG}" "${DIGEST}"
            printf "**Checksums:** \`checksums.txt\`\n"
          } >> release-notes.md

          gh release edit "${TAG}" \
            --draft=false \
            --latest \
            --notes-file release-notes.md

          published_sha="$(git ls-remote --tags origin "refs/tags/${TAG}" | awk 'NR == 1 { print $1 }')"
          if [[ "${published_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Published tag ${TAG} points to ${published_sha}, expected ${GITHUB_SHA}" >&2
            exit 1
          fi

  update-homebrew-tap:
    needs:
      - homebrew-tap-preflight
      - publish-release
      - release-meta
    if: >-
      always() &&
      needs.homebrew-tap-preflight.result == 'success' &&
      (needs.publish-release.result == 'success' ||
      needs.release-meta.outputs.bookkeep == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          path: source
          persist-credentials: false

      - name: Checkout Homebrew tap
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: sholdee/homebrew-tap
          ref: ${{ needs.homebrew-tap-preflight.outputs.default-branch }}
          path: tap
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          persist-credentials: false

      - name: Setup Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: source/go.mod
          cache: false

      - name: Update Homebrew formula
        env:
          TAG: ${{ needs.release-meta.outputs.tag }}
        shell: bash
        working-directory: source
        run: |
          curl -fsSL \
            "https://github.com/sholdee/drydock/releases/download/${TAG}/checksums.txt" \
            -o checksums.txt

          go run ./scripts/generate-homebrew-formula \
            --version "${TAG}" \
            --checksums checksums.txt \
            --output ../tap/Formula/drydock.rb

      - name: Commit and push Homebrew formula
        env:
          DEFAULT_BRANCH: ${{ needs.homebrew-tap-preflight.outputs.default-branch }}
          GIT_TERMINAL_PROMPT: "0"
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          TAG: ${{ needs.release-meta.outputs.tag }}
        shell: bash
        working-directory: tap
        run: |
          if [[ -z "$(git status --porcelain -- Formula/drydock.rb)" ]]; then
            echo "Homebrew formula already up to date for ${TAG}."
            exit 0
          fi

          git diff -- Formula/drydock.rb
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/drydock.rb
          git commit -m "chore: update drydock to ${TAG}"
          git push \
            "https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/sholdee/homebrew-tap.git" \
            "HEAD:${DEFAULT_BRANCH}"

  release-please-bookkeeping:
    needs:
      - publish-release
      - release-meta
    if: >-
      always() &&
      (needs.publish-release.result == 'success' ||
      needs.release-meta.outputs.bookkeep == 'true')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    steps:
      - name: Mark release latest and release-please PR tagged
        env:
          GH_REPO: ${{ github.repository }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ needs.release-meta.outputs.tag }}
        shell: bash
        run: |
          release_json="$(gh release view "${TAG}" --json isDraft,targetCommitish)"
          release_draft="$(jq -r '.isDraft' <<< "${release_json}")"
          release_target="$(jq -r '.targetCommitish' <<< "${release_json}")"
          if [[ "${release_draft}" != "false" ]]; then
            echo "Release ${TAG} is still a draft." >&2
            exit 1
          fi
          if [[ "${release_target}" != "${GITHUB_SHA}" ]]; then
            echo "Release ${TAG} target is ${release_target}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi

          tag_ref_json="$(gh api "repos/${GITHUB_REPOSITORY}/git/ref/tags/${TAG}")"
          tag_type="$(jq -r '.object.type' <<< "${tag_ref_json}")"
          tag_sha="$(jq -r '.object.sha' <<< "${tag_ref_json}")"
          if [[ "${tag_type}" == "tag" ]]; then
            tag_sha="$(gh api "repos/${GITHUB_REPOSITORY}/git/tags/${tag_sha}" --jq '.object.sha')"
          fi
          if [[ "${tag_sha}" != "${GITHUB_SHA}" ]]; then
            echo "Published tag ${TAG} points to ${tag_sha}, expected ${GITHUB_SHA}." >&2
            exit 1
          fi

          gh release edit "${TAG}" --latest
          latest_tag="$(gh api "repos/${GITHUB_REPOSITORY}/releases/latest" --jq '.tag_name')"
          if [[ "${latest_tag}" != "${TAG}" ]]; then
            echo "Latest release is ${latest_tag}, expected ${TAG}" >&2
            exit 1
          fi

          release_pr_number="$(
            gh api \
              -H "Accept: application/vnd.github+json" \
              "repos/${GITHUB_REPOSITORY}/commits/${GITHUB_SHA}/pulls" \
              --jq 'map(select(.merged_at != null and any(.labels[]?; .name == "autorelease: pending")))[0].number // ""'
          )"

          if [[ -z "${release_pr_number}" ]]; then
            echo "No merged release-please PR with autorelease: pending found for ${GITHUB_SHA}; skipping label update."
            exit 0
          fi

          gh api \
            --method POST \
            "repos/${GITHUB_REPOSITORY}/issues/${release_pr_number}/labels" \
            -f "labels[]=autorelease: tagged" \
            >/dev/null

          pending_label="$(jq -rn --arg label "autorelease: pending" '$label|@uri')"
          gh api \
            --method DELETE \
            "repos/${GITHUB_REPOSITORY}/issues/${release_pr_number}/labels/${pending_label}" \
            >/dev/null

          current_labels="$(
            gh api \
              "repos/${GITHUB_REPOSITORY}/issues/${release_pr_number}/labels" \
              --jq '.[].name'
          )"
          if ! grep -Fxq "autorelease: tagged" <<< "${current_labels}"; then
            echo "Release PR #${release_pr_number} is missing autorelease: tagged after label update." >&2
            exit 1
          fi
          if grep -Fxq "autorelease: pending" <<< "${current_labels}"; then
            echo "Release PR #${release_pr_number} still has autorelease: pending after label update." >&2
            exit 1
          fi
