name: Feature Request
description: Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem or use case
      description: What operator problem does this solve?
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed solution
      description: What shape should the feature take?
    validations:
      required: false

  - type: textarea
    id: runtime-boundary
    attributes:
      label: Runtime, offline, or security considerations
      description: Does this require live Argo CD, Kubernetes, external commands, credentials, or network access?
    validations:
      required: false

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
    validations:
      required: false
