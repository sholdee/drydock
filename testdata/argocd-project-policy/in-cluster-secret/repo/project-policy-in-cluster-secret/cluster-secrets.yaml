# A cluster Secret named in-cluster at another server. Argo CD resolves the
# name in-cluster to the server of a Secret with that name, and falls back to
# https://kubernetes.default.svc only when no Secret has the name
# (util/db/cluster.go:299-336, v3.6.1). The smoke applies this file to the
# live cluster, and drydock reads it from the repository.
apiVersion: v1
kind: Secret
metadata:
  name: project-policy-in-cluster-secret
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: in-cluster
  server: https://project-policy-elsewhere.invalid
