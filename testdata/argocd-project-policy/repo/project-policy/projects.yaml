apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: project-policy-source-allowed
  namespace: argocd
spec:
  sourceRepos:
    - git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
  destinations:
    - server: https://kubernetes.default.svc
      namespace: project-policy-workloads
  sourceNamespaces:
    - argocd
