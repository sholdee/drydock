# Cluster Secrets that exist only in the live Argo CD, never in the drydock
# repository. The smoke applies this file before the Applications, then adds
# a config field with a short-lived ServiceAccount token so Argo CD can reach
# the kind API server through this second address. drydock never reads this
# file.
#
# The Secret is scoped to the project-policy-destination-live-scoped-cluster
# AppProject. Argo CD adds an implicit destination for a project-scoped
# cluster (util/argo/argo.go:832-844, v3.6.1), in each namespace the Secret
# lists.
apiVersion: v1
kind: Secret
metadata:
  name: project-policy-live-scoped-cluster
  namespace: argocd
  labels:
    argocd.argoproj.io/secret-type: cluster
type: Opaque
stringData:
  name: project-policy-live-scoped
  server: https://kubernetes.default.svc.cluster.local
  project: project-policy-destination-live-scoped-cluster
  namespaces: project-policy-workloads
