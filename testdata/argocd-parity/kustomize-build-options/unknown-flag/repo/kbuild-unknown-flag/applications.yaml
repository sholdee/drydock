# Applied only while argocd-cm holds the kustomize.buildOptions of argocd-cm.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kbuild-unknown-flag
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: kbuild-unknown-flag/workloads/plain
  destination:
    name: in-cluster
    namespace: parity-kbuild-unknown-flag
