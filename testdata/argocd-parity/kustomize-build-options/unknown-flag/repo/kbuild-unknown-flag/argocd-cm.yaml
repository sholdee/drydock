# The smoke merges this file into the live argocd-cm with kubectl patch
# --type merge before it applies applications.yaml, and drydock reads it
# from this repo. kustomize build fails on the unknown flag, for every Kustomize source.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  kustomize.buildOptions: --enable-helm --no-such-flag
