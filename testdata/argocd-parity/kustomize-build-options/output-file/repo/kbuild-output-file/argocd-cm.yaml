# The smoke merges this file into the live argocd-cm with kubectl patch
# --type merge before it applies applications.yaml, and drydock reads it
# from this repo. kustomize writes the build to out.yaml in the checkout,
# so Argo CD reads no manifests and does not fail.
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
  namespace: argocd
data:
  kustomize.buildOptions: --enable-helm -o out.yaml
