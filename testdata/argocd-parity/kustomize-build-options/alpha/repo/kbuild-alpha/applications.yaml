# Applied only while argocd-cm holds the kustomize.buildOptions of argocd-cm.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kbuild-alpha-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: kbuild-alpha/workloads/helm
    kustomize:
      kubeVersion: 1.31.0
      apiVersions:
        - parity.example.com/v1/FromApplication
  destination:
    name: in-cluster
    namespace: parity-kbuild-alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kbuild-alpha-shared
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: kbuild-alpha/workloads/shared
  destination:
    name: in-cluster
    namespace: parity-kbuild-alpha
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kbuild-alpha-plain
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: kbuild-alpha/workloads/plain
  destination:
    name: in-cluster
    namespace: parity-kbuild-alpha
