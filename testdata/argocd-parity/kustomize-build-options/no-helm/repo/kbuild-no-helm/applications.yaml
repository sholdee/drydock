# Applied only while argocd-cm holds the kustomize.buildOptions of argocd-cm.yaml.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kbuild-no-helm-plain
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: kbuild-no-helm/workloads/plain
  destination:
    name: in-cluster
    namespace: parity-kbuild-no-helm
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kbuild-no-helm-charts
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: kbuild-no-helm/workloads/charts
  destination:
    name: in-cluster
    namespace: parity-kbuild-no-helm
---
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kbuild-no-helm-version
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: kbuild-no-helm/workloads/version
    kustomize:
      version: v9.9.9
  destination:
    name: in-cluster
    namespace: parity-kbuild-no-helm
