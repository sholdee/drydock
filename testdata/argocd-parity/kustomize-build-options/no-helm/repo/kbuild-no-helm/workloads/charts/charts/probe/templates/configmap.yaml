apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
data:
  kubeVersion: {{ .Capabilities.KubeVersion.Version | quote }}
  hasBuildOptionsAPI: {{ .Capabilities.APIVersions.Has "parity.example.com/v1/FromBuildOptions" | quote }}
  hasApplicationAPI: {{ .Capabilities.APIVersions.Has "parity.example.com/v1/FromApplication" | quote }}
  hasEntryAPI: {{ .Capabilities.APIVersions.Has "parity.example.com/v1/FromEntry" | quote }}
