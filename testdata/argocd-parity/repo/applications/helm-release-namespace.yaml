apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-helm-release-namespace
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: charts/release-namespace
    helm:
      valuesObject:
        marker: release-namespace
  destination:
    name: in-cluster
    namespace: parity-helm-destination
