apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-helm-defaults
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-helm-defaults
    # Argo CD passes these to kustomize as --helm-kube-version and
    # --helm-api-versions. No kustomize.namespace, so kustomize passes no
    # namespace to helm.
    kustomize:
      kubeVersion: 1.31.0
      apiVersions:
        - flag.parity.example.com/v1
  destination:
    name: in-cluster
    namespace: parity-kustomize-helm-defaults
