# The revision variables through a Jsonnet TLA and extVars of a Git source.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-app-revision-jsonnet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/app-revision-jsonnet
    directory:
      jsonnet:
        extVars:
          - name: short
            value: $ARGOCD_APP_REVISION_SHORT
          - name: short8
            value: $ARGOCD_APP_REVISION_SHORT_8
        tlas:
          - name: revision
            value: $ARGOCD_APP_REVISION
  destination:
    name: in-cluster
    namespace: parity-app-revision-jsonnet
