apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-helm-range-short
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://argocd-parity-registry.argocd-parity.svc.cluster.local:18879
    chart: parity-range
    targetRevision: "1.2"
    helm:
      parameters:
        - name: revision
          value: $ARGOCD_APP_REVISION
  destination:
    name: in-cluster
    namespace: parity-helm-range
