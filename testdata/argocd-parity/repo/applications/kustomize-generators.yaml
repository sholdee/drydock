apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-generators
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-generators/base
    kustomize:
      ignoreMissingComponents: true
      # Argo CD v3.6.1 skips no-kustomization (it has no kustomization file),
      # adds extra (the first valid component), and then stops. It drops the
      # valid after-first-valid component and never checks missing. drydock
      # renders the same and warns about after-first-valid.
      components:
        - ../components/no-kustomization
        - ../components/extra
        - ../components/after-first-valid
        - ../components/missing
  destination:
    name: in-cluster
    namespace: parity-kustomize-generators
