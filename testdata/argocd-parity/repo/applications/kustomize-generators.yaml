apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-generators
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-generators/base
    kustomize:
      ignoreMissingComponents: true
      # Argo CD v3.6.2 checks every entry. It skips no-kustomization (it has
      # no kustomization file) and missing, and it adds extra and
      # after-first-valid. Argo CD v3.6.1 stopped after extra and dropped
      # after-first-valid. drydock renders the same as v3.6.2.
      components:
        - ../components/no-kustomization
        - ../components/extra
        - ../components/after-first-valid
        - ../components/missing
  destination:
    name: in-cluster
    namespace: parity-kustomize-generators
