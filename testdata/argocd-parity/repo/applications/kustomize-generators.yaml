apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-generators
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-generators/base
    kustomize:
      ignoreMissingComponents: true
      # no-kustomization comes first: Argo CD v3.6.1 stops at the first valid
      # component, so a later entry would not exercise its kustomization check.
      components:
        - ../components/no-kustomization
        - ../components/extra
        - ../components/missing
  destination:
    name: in-cluster
    namespace: parity-kustomize-generators
