apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-source-images
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-source-options/images
    kustomize:
      images:
        # kustomize edit set image sorts the images by name, so a is
        # renamed to b, then b to registry.example.invalid/renamed-b.
        - a=b
        # The * keeps the newTag of the nginx image in the kustomization.
        - nginx=registry.example.invalid/nginx:*
        # A tag and a digest without =.
        - busybox:1.36@sha256:0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef
        # = with nothing after it sets an entry with only the name. Here no
        # redis entry exists, so it changes nothing. It would replace an
        # existing redis entry.
        - redis=
        # An empty name before = counts as no =. The entry sets the tag of
        # memcached and replaces the memcached entry of the kustomization.
        - "=memcached:1.6"
      # kustomize matches the patch option names without regard to letter
      # case.
      patches:
        - target:
            kind: Deployment
            name: images
          patch: |-
            - op: replace
              path: /metadata/name
              value: images-renamed
          options:
            AllowNameChange: true
  destination:
    name: in-cluster
    namespace: parity-kustomize-source-images
