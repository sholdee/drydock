# ARGOCD_APP_REVISION, _SHORT and _SHORT_8 through Helm parameters of a Git
# source. Both sides must render the commit SHA of the fixture repository.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-app-revision-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: charts/app-revision
    helm:
      parameters:
        - name: revision
          value: $ARGOCD_APP_REVISION
          forceString: true
        - name: short
          value: $ARGOCD_APP_REVISION_SHORT
          forceString: true
        - name: short8
          value: ${ARGOCD_APP_REVISION_SHORT_8}
          forceString: true
  destination:
    name: in-cluster
    namespace: parity-app-revision-helm
