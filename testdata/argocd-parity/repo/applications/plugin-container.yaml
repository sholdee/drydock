apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-plugin-container
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/plugin-container
    plugin:
      name: parity-container
      env:
        - name: MODE
          value: container
      parameters:
        - name: title
          string: from-container
  destination:
    name: in-cluster
    namespace: parity-plugin-container
