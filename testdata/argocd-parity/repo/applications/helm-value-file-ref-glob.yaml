apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-helm-value-file-ref-glob
  namespace: argocd
spec:
  project: default
  sources:
    - repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
      targetRevision: HEAD
      path: charts/helm-value-file-paths
      helm:
        valueFiles:
          - $values/value-file-links/b.yaml
          - $values/value-file-links/glob/*.yaml
          - $values/value-file-links/glob/linked.yaml
    - repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
      targetRevision: HEAD
      ref: values
  destination:
    name: in-cluster
    namespace: parity-helm-value-file-ref-glob
