apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-directory-extension-filter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/directory-extension-filter
    directory:
      recurse: true
      disableExtensionFilter: true
      include: '{*.yaml.sealed,*.yaml,**/*.manifest}'
  destination:
    name: in-cluster
    namespace: parity-directory-extension-filter
