apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-helm-capabilities
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: charts/helm-capabilities
    helm:
      releaseName: parity-helm-capabilities
      kubeVersion: 1.30.0
      apiVersions:
        - example.com/v1/Widget
  destination:
    name: in-cluster
    namespace: parity-helm-capabilities
