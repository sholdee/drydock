apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-helm-values-precedence
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: charts/values-precedence
    helm:
      releaseName: parity-helm-values-precedence
      valueFiles:
        - values/layer.yaml
      values: |
        c: from-values-string
        d: from-values-string
      valuesObject:
        d: from-values-object
      parameters:
        - name: e
          value: from-parameter
  destination:
    name: in-cluster
    namespace: parity-helm-values-precedence
