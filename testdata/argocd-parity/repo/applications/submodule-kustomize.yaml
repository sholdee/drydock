apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-submodule-kustomize
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/submodule-parent.git
    targetRevision: HEAD
    path: overlay
  destination:
    name: in-cluster
    namespace: parity-submodule
