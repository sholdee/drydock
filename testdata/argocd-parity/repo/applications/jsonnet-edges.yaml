apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-jsonnet-edges
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/jsonnet-edges
    directory:
      recurse: true
      jsonnet:
        extVars:
          - name: cmName
            value: 'std.join("-", ["parity", "jsonnet", "edges"])'
            code: true
          - name: source
            value: jsonnet-edges
        tlas:
          - name: namespace
            value: '"parity-jsonnet-edges"'
            code: true
          - name: flavor
            value: repo-lib
        libs:
          - workloads/jsonnet-edges/lib
  destination:
    name: in-cluster
    namespace: parity-jsonnet-edges
