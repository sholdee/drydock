apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-directory-edges
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/directory-edges
    directory:
      recurse: true
      include: "*.yaml"
      exclude: skip.yaml
  destination:
    name: in-cluster
    namespace: parity-directory-edges
