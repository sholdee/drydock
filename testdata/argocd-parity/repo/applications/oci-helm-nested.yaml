apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-oci-helm-nested
  namespace: argocd
spec:
  project: default
  source:
    repoURL: argocd-parity-registry.argocd-parity.svc.cluster.local:5443
    chart: parity/nested/parity-nested-chart
    targetRevision: 1.0.0
    helm:
      valuesObject:
        fromValues: from-application
  destination:
    name: in-cluster
    namespace: parity-oci-helm-nested
