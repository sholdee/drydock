apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-jsonnet
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/jsonnet
    directory:
      recurse: true
      jsonnet:
        extVars:
          - name: name
            value: parity-jsonnet
        tlas:
          - name: namespace
            value: parity-jsonnet
  destination:
    name: in-cluster
    namespace: parity-jsonnet
