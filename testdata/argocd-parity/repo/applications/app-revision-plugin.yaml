# The revision variables in the environment of a config management plugin.
# It reuses the parity-env plugin, which runs generate.awk from the source
# path, so this source carries its own generate.awk.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-app-revision-plugin
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/app-revision-plugin
    plugin:
      name: parity-env
  destination:
    name: in-cluster
    namespace: parity-app-revision-plugin
