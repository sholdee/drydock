apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-directory-flat
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/directory-flat
  destination:
    name: in-cluster
    namespace: parity-directory-flat
