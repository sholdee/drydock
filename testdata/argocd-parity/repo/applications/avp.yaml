apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-avp
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/avp
    # The exact name drydock's built-in AVP compatibility matches. No env or
    # parameters: AVP compatibility rejects both.
    plugin:
      name: argocd-vault-plugin
  destination:
    name: in-cluster
    namespace: parity-avp
