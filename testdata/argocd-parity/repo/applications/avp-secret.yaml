apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-avp-secret
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    # Secrets only. Argo CD masks their data in `argocd app manifests`, so
    # this Application is compared through the kubectl-exec AVP oracle, not
    # the masked comparison; see the fixture README.
    path: workloads/avp-secret
    plugin:
      name: argocd-vault-plugin
  destination:
    name: in-cluster
    namespace: parity-avp
