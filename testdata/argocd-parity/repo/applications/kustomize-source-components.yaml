apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-source-components
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-source-options/components/app
    kustomize:
      # The glob adds a and b but not .hidden. a is already in the
      # kustomization, and the repeated b is added once.
      components:
        - ../parts/*
        - ../parts/b
        - ../parts/b
  destination:
    name: in-cluster
    namespace: parity-kustomize-source-components
