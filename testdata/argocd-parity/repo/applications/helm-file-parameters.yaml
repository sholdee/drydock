apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-helm-file-parameters
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: charts/helm-file-parameters
    helm:
      releaseName: parity-helm-file-parameters
      fileParameters:
        - name: loadedText
          path: files/message.txt
  destination:
    name: in-cluster
    namespace: parity-helm-file-parameters
