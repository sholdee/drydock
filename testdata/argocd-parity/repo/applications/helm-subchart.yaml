apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-helm-subchart
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: charts/subchart-parent
    helm:
      releaseName: parity-helm-subchart
  destination:
    name: in-cluster
    namespace: parity-helm-subchart
