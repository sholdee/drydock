apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-repeated-resource
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/repeated-resource
    directory:
      recurse: true
  destination:
    name: in-cluster
    namespace: parity-repeated-resource
