apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize
  namespace: argocd
spec:
  project: default
  source:
    repoURL: http://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize
    kustomize:
      namePrefix: parity-
      namespace: parity-kustomize
  destination:
    name: in-cluster
    namespace: parity-kustomize
