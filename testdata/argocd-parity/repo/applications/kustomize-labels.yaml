apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-labels
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-labels
    kustomize:
      namespace: parity-kustomize-labels
      commonLabels:
        parity-edge: from-source-option
        conflict-label: from-source-option
      forceCommonLabels: true
      labelWithoutSelector: true
      labelIncludeTemplates: true
      commonAnnotations:
        parity-annotation: ${ARGOCD_APP_NAME}
        conflict-annotation: from-source-option
      commonAnnotationsEnvsubst: true
      forceCommonAnnotations: true
  destination:
    name: in-cluster
    namespace: parity-kustomize-labels
