apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-kustomize-helm-shared-api-versions
  namespace: argocd
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/kustomize-helm-shared-api-versions
    # Argo CD passes each API version as one --helm-api-versions flag, so
    # kustomize holds the two values in one slice.
    kustomize:
      kubeVersion: 1.31.0
      apiVersions:
        - flag.parity.example.com/one
        - flag.parity.example.com/two
  destination:
    name: in-cluster
    namespace: parity-kustomize-helm-shared-api-versions
