apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-decode-helm-value-file-bare-ref
  namespace: parity-directory-decode
spec:
  project: parity-directory-decode
  sources:
    - repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
      targetRevision: HEAD
      path: workloads/directory-decode/helm-value-file-bare-ref
      helm:
        valueFiles:
          - $values
    - repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
      targetRevision: HEAD
      ref: values
  destination:
    server: https://kubernetes.default.svc
    namespace: parity-directory-decode-workloads
