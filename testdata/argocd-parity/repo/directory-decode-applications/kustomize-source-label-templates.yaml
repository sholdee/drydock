apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-decode-kustomize-source-label-templates
  namespace: parity-directory-decode
spec:
  project: parity-directory-decode
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/directory-decode/kustomize-source-label-templates
    kustomize:
      commonLabels:
        zone: from-source-option
      labelIncludeTemplates: true
  destination:
    server: https://kubernetes.default.svc
    namespace: parity-directory-decode-workloads
