# A multi-source entry needs path, chart, or ref (InvalidSpecError).
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-decode-spec-sources-no-ref
  namespace: parity-directory-decode
spec:
  project: parity-directory-decode
  destination:
    server: https://kubernetes.default.svc
    namespace: parity-directory-decode-workloads
  sources:
    - repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
      targetRevision: HEAD
      path: workloads/source-hydrator/dry
    - repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
      targetRevision: HEAD
