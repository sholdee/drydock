# An oci:// source needs path or chart too (InvalidSpecError), so the
# repo-server never pulls the artifact.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-decode-spec-oci-no-path
  namespace: parity-directory-decode
spec:
  project: parity-directory-decode
  destination:
    server: https://kubernetes.default.svc
    namespace: parity-directory-decode-workloads
  source:
    repoURL: oci://argocd-parity-registry.argocd-parity.svc.cluster.local:5443/parity/config
    targetRevision: v1.0.0
