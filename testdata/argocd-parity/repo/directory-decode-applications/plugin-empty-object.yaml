apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-decode-plugin-empty-object
  namespace: parity-directory-decode
spec:
  project: parity-directory-decode
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/directory-decode/plugin-empty-object
    plugin:
      name: parity-env
  destination:
    server: https://kubernetes.default.svc
    namespace: parity-directory-decode-workloads
