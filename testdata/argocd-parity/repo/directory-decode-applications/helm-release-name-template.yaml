apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-decode-helm-release-name-template
  namespace: parity-directory-decode
spec:
  project: parity-directory-decode
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/directory-decode/helm-release-name-template
    helm:
      # Argo CD v3.6.3 passes the release name to helm as written and
      # rejects it, because it is not a valid release name. Argo CD v3.6.2
      # passed it as --name-template, and helm evaluated it.
      releaseName: '{{ .Missing.Field }'
  destination:
    server: https://kubernetes.default.svc
    namespace: parity-directory-decode-workloads
