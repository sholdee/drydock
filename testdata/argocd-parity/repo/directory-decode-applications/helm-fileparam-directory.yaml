apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-decode-helm-fileparam-directory
  namespace: parity-directory-decode
spec:
  project: parity-directory-decode
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
    targetRevision: HEAD
    path: workloads/directory-decode/helm-fileparam-directory
    helm:
      fileParameters:
        - name: value
          path: ../../../file-parameter-links/to-dir
  destination:
    server: https://kubernetes.default.svc
    namespace: parity-directory-decode-workloads
