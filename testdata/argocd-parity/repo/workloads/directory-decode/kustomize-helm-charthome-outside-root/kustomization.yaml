apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The chart home is outside the kustomization directory, and the entry sets
# no valuesFile. kustomize loads <chartHome>/<name>/values.yaml through the
# load restrictor and fails.
helmGlobals:
  chartHome: ../kustomize-helm-shared-charts
helmCharts:
  - name: rootprobe
    releaseName: rootprobe
