apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# The values file is a directory outside the kustomization directory. The
# kustomize load restrictor checks for a directory first.
helmCharts:
  - name: rootprobe
    releaseName: rootprobe
    additionalValuesFiles:
      - ../kustomize-helm-values-outside-dir
