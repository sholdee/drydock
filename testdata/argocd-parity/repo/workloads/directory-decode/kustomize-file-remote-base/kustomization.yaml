apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
# A remote base with the file transport. kustomize clones it with git from
# the file system of the repo-server, so Argo CD fails only because no Git
# repository is at this path. drydock refuses the file transport before it
# fetches anything (a recorded divergence, docs/compatibility.md).
resources:
  - file:///parity-file-remote-base/repo.git//base
