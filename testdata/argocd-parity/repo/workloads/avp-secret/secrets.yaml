# argocd-vault-plugin Secret parity workload. `argocd app manifests` masks
# every Secret data and stringData value as ++++++++, so this directory is
# never part of the masked comparison: the smoke copies it into the AVP
# sidecar, runs `argocd-vault-plugin generate` there and compares that output
# with drydock's render of the parity-avp-secret Application.
#
# For kind Secret both sides try every string as padded standard base64 and,
# when it decodes to text holding a <...> span, substitute in the decoded
# text and re-encode; everything else is processed as plain text. Secret
# keys obey the placeholder rules in the fixture README. The smoke counts
# drydock-redacted- markers both literally and inside decoded base64 tokens;
# update AVP_SECRET_EXPECTED_MARKERS in scripts/argocd-parity-smoke.sh with
# any change here.
apiVersion: v1
kind: Secret
metadata:
  name: "parity-avp-secret-inline"
  namespace: "parity-avp"
type: Opaque
data:
  # base64("<path:parity-avp-backend#password>")
  password: "PHBhdGg6cGFyaXR5LWF2cC1iYWNrZW5kI3Bhc3N3b3JkPg=="
  # base64("postgres://<path:parity-avp-backend#username>:<path:parity-avp-backend#password>@db.example.invalid:5432/app")
  dsn: "cG9zdGdyZXM6Ly88cGF0aDpwYXJpdHktYXZwLWJhY2tlbmQjdXNlcm5hbWU+OjxwYXRoOnBhcml0eS1hdnAtYmFja2VuZCNwYXNzd29yZD5AZGIuZXhhbXBsZS5pbnZhbGlkOjU0MzIvYXBw"
  # base64("<html>not a placeholder</html>"): decodes to a <...> span that is
  # no inline token, so it is re-encoded unchanged on both sides.
  markup: "PGh0bWw+bm90IGEgcGxhY2Vob2xkZXI8L2h0bWw+"
  # base64("left exactly as written"): no span, left as plain text.
  plain: "bGVmdCBleGFjdGx5IGFzIHdyaXR0ZW4="
stringData:
  # Not base64, so processed as plain text like a ConfigMap value.
  username: "<path:parity-avp-backend#username>"
  endpoint: "https://<path:parity-avp-backend#endpoint>/v1"
---
apiVersion: v1
kind: Secret
metadata:
  name: "parity-avp-secret-annotated"
  namespace: "parity-avp"
  annotations:
    avp.kubernetes.io/path: "parity-avp-backend"
type: Opaque
data:
  # base64("<endpoint>"): a generic key inside base64.
  endpoint: "PGVuZHBvaW50Pg=="
  # base64("https://<endpoint>/v1")
  url: "aHR0cHM6Ly88ZW5kcG9pbnQ+L3Yx"
stringData:
  password: "<password>"
  inline: "<path:parity-avp-backend#username>"
