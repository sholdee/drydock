# A valid component listed after the first valid one. Under
# ignoreMissingComponents, Argo CD v3.6.2 adds every valid component, so this
# ConfigMap must render. Argo CD v3.6.1 dropped it.
apiVersion: v1
kind: ConfigMap
metadata:
  name: generators-after-first-valid
  namespace: parity-kustomize-generators
data:
  from: second-valid-component
