apiVersion: v1
kind: ConfigMap
metadata:
  name: parity-kustomize-helm-defaults-defaults
  namespace: parity-kustomize-helm-defaults
data:
  releaseName: {{ .Release.Name | quote }}
  releaseNamespace: {{ .Release.Namespace | quote }}
  kubeVersion: {{ .Capabilities.KubeVersion.Version | quote }}
  hasChartAPI: {{ .Capabilities.APIVersions.Has "chart.parity.example.com/v1" | quote }}
  hasFlagAPI: {{ .Capabilities.APIVersions.Has "flag.parity.example.com/v1" | quote }}
