apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  fromRepoOverride: {{ .Values.fromRepoOverride }}
  fromAppOverride: {{ .Values.fromAppOverride }}
  both: {{ .Values.both }}
  decoy: {{ .Values.decoy }}
  appName: {{ .Values.appName }}
  appNamespace: {{ .Values.appNamespace }}
