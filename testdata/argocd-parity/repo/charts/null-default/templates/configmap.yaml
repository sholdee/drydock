apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}
  namespace: {{ .Release.Namespace }}
data:
  {{- if hasKey .Values "debugVerbose" }}
  # Cilium-faithful pattern: literal surrounding quotes would render a null
  # chart default as an empty STRING (not YAML null).  Helm v4 — Argo CD's
  # repo-server CLI since v3.5 — strips null chart defaults (hasKey → false,
  # key absent), so this block must NOT render.  This asserts parity with the
  # Argo CD helm v4 behaviour; helm v3 kept the null and rendered "".
  debug-verbose: "{{ .Values.debugVerbose }}"
  {{- end }}
