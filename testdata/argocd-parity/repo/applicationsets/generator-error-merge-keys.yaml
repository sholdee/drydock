# A merge whose first child repeats a merge key value. Argo CD v3.6.1
# requires unique merge keys and returns ErrNonUniqueParamSets
# (applicationset/generators/merge.go:106-134).
# Argo CD v3.6.1 then fails the whole ApplicationSet with an ErrorOccurred
# condition, so the sibling list generator generates nothing either, and
# no parity-gen-error-merge-keys-* name exists. drydock must warn
# appset.generator-failed and generate none. APPLICATIONSET_ERRORS in the
# smoke waits for the condition.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-gen-error-merge-keys
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - suffix: sibling
    - merge:
        mergeKeys: [suffix]
        generators:
          - list:
              elements:
                - suffix: merged
                - suffix: merged
          - list:
              elements:
                - suffix: merged
  template:
    metadata:
      name: "parity-gen-error-merge-keys-{{.suffix}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: workloads/appset/validation/empty-name-alpha
      destination:
        name: in-cluster
        namespace: "parity-gen-error-merge-keys-{{.suffix}}"
