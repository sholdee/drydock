apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-matrix
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - matrix:
        generators:
          - list:
              elements:
                - env: dev
                - env: prod
          - git:
              repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
              revision: HEAD
              directories:
                - path: workloads/appset/matrix/components/*
  template:
    metadata:
      name: "parity-matrix-{{.env}}-{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: "{{.path.path}}/overlays/{{.env}}"
      destination:
        name: in-cluster
        namespace: "parity-matrix-{{.env}}"
