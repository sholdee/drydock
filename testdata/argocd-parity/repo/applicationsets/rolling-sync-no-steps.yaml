# An empty steps list. Argo CD sets ErrorOccurred with reason
# ApplicationSetRolloutError and returns before it creates any Application.
# The generator has an element, so this proves that both sides drop the
# Application: no parity-rolling-sync-no-steps-* name is in APPLICATIONS.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-rolling-sync-no-steps
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  strategy:
    type: RollingSync
    rollingSync:
      steps: []
  template:
    metadata:
      name: "parity-rolling-sync-no-steps-{{.env}}"
      labels:
        env: "{{.env}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: workloads/appset/rolling-sync
      destination:
        name: in-cluster
        namespace: "parity-rolling-sync-no-steps-{{.env}}"
