# Both steps select the one Application.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-rolling-sync-duplicate
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - env: dev
  strategy:
    type: RollingSync
    rollingSync:
      steps:
        - matchExpressions:
            - key: env
              operator: In
              values: [dev]
        - matchExpressions:
            - key: env
              operator: NotIn
              values: [prod]
  template:
    metadata:
      name: "parity-rolling-sync-duplicate-{{.env}}"
      labels:
        env: "{{.env}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: workloads/appset/rolling-sync
      destination:
        name: in-cluster
        namespace: "parity-rolling-sync-duplicate-{{.env}}"
      # The controller starts real syncs. This keeps them from failing on a
      # missing namespace. drydock and argocd app manifests both leave the
      # created Namespace out.
      syncPolicy:
        syncOptions:
          - CreateNamespace=true
