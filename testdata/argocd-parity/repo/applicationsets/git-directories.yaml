apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-git-directories
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - git:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        revision: HEAD
        directories:
          - path: workloads/appset/git/*
  template:
    metadata:
      name: "parity-git-{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        name: in-cluster
        namespace: "parity-git-{{.path.basename}}"
