# A cluster generator selector whose value is not a valid label value. Argo
# CD v3.6.1 lists the cluster Secrets with metav1.LabelSelectorAsSelector,
# which rejects it, and returns the error
# (applicationset/generators/cluster.go:194-198).
# Argo CD v3.6.1 then fails the whole ApplicationSet with an ErrorOccurred
# condition, so the sibling list generator generates nothing either, and
# no parity-gen-error-cluster-selector-* name exists. drydock must warn
# appset.generator-failed and generate none. APPLICATIONSET_ERRORS in the
# smoke waits for the condition.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-gen-error-cluster-selector
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - suffix: sibling
    - clusters:
        selector:
          matchLabels:
            parity.drydock.dev/role: https://alpha.parity-clusters.invalid
  template:
    metadata:
      name: "parity-gen-error-cluster-selector-{{.suffix}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: workloads/appset/validation/empty-name-alpha
      destination:
        name: in-cluster
        namespace: "parity-gen-error-cluster-selector-{{.suffix}}"
