# A list generator whose elementsYaml holds a scalar entry. Argo CD v3.6.1
# decodes elementsYaml into a list of mappings and returns the error
# (applicationset/generators/list.go:80-86), even though its elements decode.
# Argo CD v3.6.1 then fails the whole ApplicationSet with an ErrorOccurred
# condition, so the sibling list generator generates nothing either, and
# no parity-gen-error-elements-yaml-* name exists. drydock must warn
# appset.generator-failed and generate none. APPLICATIONSET_ERRORS in the
# smoke waits for the condition.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-gen-error-elements-yaml
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - suffix: sibling
    - list:
        elements:
          - suffix: element
        elementsYaml: |
          - not-a-mapping
  template:
    metadata:
      name: "parity-gen-error-elements-yaml-{{.suffix}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: workloads/appset/validation/empty-name-alpha
      destination:
        name: in-cluster
        namespace: "parity-gen-error-elements-yaml-{{.suffix}}"
