# Argo CD v3.6.1 flattens generator params for selectors with
# github.com/jeremywohl/flatten, which only walks maps and []any
# (applicationset/generators/generator_spec_processor.go:126-160). The
# []string path.segments param is one selector key whose value is the fmt
# rendering of the list, such as "[workloads appset git alpha]". There is no
# path.segments.N key.
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: parity-selector-list-params
  namespace: argocd
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    # Matches alpha only: the whole list is one value.
    - git:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        revision: HEAD
        directories:
          - path: workloads/appset/git/*
      selector:
        matchLabels:
          path.segments: "[workloads appset git alpha]"
    # Matches nothing: path.segments.3 is not a key, so no
    # parity-segments-index-* Application may exist on either side.
    - git:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        revision: HEAD
        directories:
          - path: workloads/appset/git/*
        template:
          metadata:
            name: "parity-segments-index-{{.path.basename}}"
          spec:
            project: default
            source:
              repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
              targetRevision: HEAD
              path: "{{.path.path}}"
            destination:
              name: in-cluster
              namespace: "parity-segments-{{.path.basename}}"
      selector:
        matchExpressions:
          - key: path.segments.3
            operator: Exists
  template:
    metadata:
      name: "parity-segments-{{.path.basename}}"
    spec:
      project: default
      source:
        repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/repo.git
        targetRevision: HEAD
        path: "{{.path.path}}"
      destination:
        name: in-cluster
        namespace: "parity-segments-{{.path.basename}}"
