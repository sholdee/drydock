apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-live-diff-rules-change
  namespace: argocd
  annotations:
    argocd.argoproj.io/compare-options: ServerSideDiff=true
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/live-diff.git
    targetRevision: live-diff-a
    path: workloads/rules-change
  destination:
    name: in-cluster
    namespace: parity-live-diff
  # live-diff-a had this rule for rule-removed.
  ignoreDifferences:
    - kind: ConfigMap
      name: rule-added
      jsonPointers:
        - /data/ignored
  syncPolicy:
    syncOptions:
      - ServerSideApply=true
