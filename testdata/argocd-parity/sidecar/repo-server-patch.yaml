# Strategic merge patch for the Argo CD repo-server Deployment. containers and
# volumes merge on `name`, so listing only the new entries preserves the
# upstream argocd-repo-server container, the copyutil initContainer, and the
# var-files / plugins / tmp volumes the install manifest already declares.
#
# __ARGOCD_IMAGE__ is substituted by install_cmp_sidecar with the image the
# install manifest uses, so the parity-env sidecar shares the image already
# pulled onto the kind node. Every sidecar runs the version-matched
# argocd-cmp-server copyutil staged into var-files, whatever its image.
spec:
  template:
    metadata:
      annotations:
        # Keep ad-hoc `kubectl logs`/`kubectl exec deployment/argocd-repo-server`
        # on the real repo-server; the merge places the sidecar first.
        kubectl.kubernetes.io/default-container: argocd-repo-server
    spec:
      containers:
        - name: parity-env
          image: __ARGOCD_IMAGE__
          imagePullPolicy: IfNotPresent
          # copyutil already staged this symlink into var-files; naming it as
          # the command overrides the image entrypoint.
          command: ["/var/run/argocd/argocd-cmp-server"]
          args: ["--loglevel", "debug"]
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            # repo-server discovers plugins by listing socket files here, so
            # this must be the shared volume.
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: parity-env-cmp
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            # A private tmp: the CMP workdir is <tmp>/_cmp_server, and sharing
            # repo-server's tmp volume is forbidden upstream as a
            # path-traversal mitigation.
            - name: cmp-tmp
              mountPath: /tmp
        # The container-plugin sidecar. __PARITY_ALPINE_IMAGE__ is the pinned
        # alpine the smoke pulled by digest, re-tagged and kind-loaded; it is
        # the image drydock's container engine runs. argocd-cmp-server is
        # static, so the staged binary runs on alpine unchanged.
        - name: parity-container
          image: __PARITY_ALPINE_IMAGE__
          imagePullPolicy: Never
          command: ["/var/run/argocd/argocd-cmp-server"]
          args: ["--loglevel", "debug"]
          # uid 999 has no passwd entry on alpine, so HOME would default to /;
          # point it at the writable tmp instead of relying on nothing using it.
          env:
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: parity-container-cmp
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            # Each sidecar gets its own private tmp.
            - name: parity-container-tmp
              mountPath: /tmp
        # The argocd-vault-plugin sidecar. __PARITY_AVP_IMAGE__ is the pinned
        # alpine plus the sha256-pinned AVP release binary, committed and
        # kind-loaded by the smoke.
        - name: argocd-vault-plugin
          image: __PARITY_AVP_IMAGE__
          imagePullPolicy: Never
          command: ["/var/run/argocd/argocd-cmp-server"]
          # Default log level on purpose: debug logs the full generated
          # output.
          env:
            - name: AVP_TYPE
              value: kubernetessecret
            # Same no-passwd-entry reason as parity-container.
            - name: HOME
              value: /tmp
          securityContext:
            runAsNonRoot: true
            runAsUser: 999
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
            - name: var-files
              mountPath: /var/run/argocd
            - name: plugins
              mountPath: /home/argocd/cmp-server/plugins
            - name: parity-avp-cmp
              mountPath: /home/argocd/cmp-server/config/plugin.yaml
              subPath: plugin.yaml
            - name: parity-avp-tmp
              mountPath: /tmp
            # The repo-server pod sets automountServiceAccountToken: false,
            # but AVP's kubernetessecret backend logs in with
            # rest.InClusterConfig before it reads any manifest. This mounts
            # the standard token, CA and namespace files in this container
            # only.
            - name: parity-avp-serviceaccount
              mountPath: /var/run/secrets/kubernetes.io/serviceaccount
              readOnly: true
      volumes:
        - name: parity-env-cmp
          configMap:
            name: parity-env-cmp
        - name: cmp-tmp
          emptyDir: {}
        - name: parity-container-cmp
          configMap:
            name: parity-container-cmp
        - name: parity-container-tmp
          emptyDir: {}
        - name: parity-avp-cmp
          configMap:
            name: parity-avp-cmp
        - name: parity-avp-tmp
          emptyDir: {}
        - name: parity-avp-serviceaccount
          projected:
            sources:
              - serviceAccountToken:
                  path: token
              - configMap:
                  name: kube-root-ca.crt
                  items:
                    - key: ca.crt
                      path: ca.crt
              - downwardAPI:
                  items:
                    - path: namespace
                      fieldRef:
                        fieldPath: metadata.namespace
