apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: parity-controller-ssd
  namespace: argocd
# This Application has no diff option. The controller-level switch
# controller.diff.server.side decides that Argo CD compares it with
# server-side diff.
spec:
  project: default
  source:
    repoURL: git://argocd-parity-git.argocd-parity.svc.cluster.local/live-diff-controller-ssd.git
    targetRevision: controller-ssd-a
    path: workloads/removed-object
  destination:
    name: in-cluster
    namespace: parity-controller-ssd
