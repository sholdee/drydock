# Decode failures for the Argo CD render parity smoke: directory sources, and
# Helm, Kustomize, and plugin output. A case without source is a directory
# case. A case with source helm, kustomize, or plugin holds a chart, a
# Kustomize base, or a plugin program in the same place. For a plugin case,
# file is the plugin program, and drydockMessage must name the plugin output,
# generate-output, instead.
#
# Each case is an Application in the parity-directory-decode namespace
# (repo/directory-decode-applications). Its source directory holds a valid
# ConfigMap and one file that fails the source in Argo CD v3.6.1. Most such
# files fail in the repo-server (getObjsFromYAMLOrJSON,
# reposerver/repository/repository.go). Argo CD must report a ComparisonError
# condition that contains argocdMessage, and `drydock build app` must fail
# with stderr that contains drydockMessage. Both messages must name the file.
#
# A .json object without a kind fails later, in the controller. Its message
# quotes the manifest instead of naming the file, so those cases set
# argocdQuotesObject and quote the start of the manifest. Go sorts the keys,
# and the tracking annotation is part of the manifest.
#
# Tracking metadata that cannot be set fails in the repo-server after every
# file was read. Its message names the object, not the file, so those cases
# set argocdNamesObject to the object name in the failing file.
#
# Files that both sides skip, and files whose text both sides decode first
# (byte order marks, invalid UTF-8), live in the parity-directory-decode-skips
# Application, which the main manifest comparison covers.
cases:
  # A .json file must hold one JSON object. A syntax error fails the source.
  - name: parity-decode-json-invalid
    file: invalid.json
    argocdMessage: Failed to unmarshal "invalid.json"
    drydockMessage: "invalid.json: decode JSON object failed"
  # A second object after the first fails the source.
  - name: parity-decode-json-multiple
    file: multiple.json
    argocdMessage: Found multiple objects in "multiple.json"
    drydockMessage: "multiple.json: found multiple objects"
  # A JSON array is not an object, even when it holds manifests.
  - name: parity-decode-json-array
    file: array.json
    argocdMessage: Failed to unmarshal "array.json"
    drydockMessage: "array.json: decode JSON object failed"
  # An empty .json file fails, where an empty .yaml file is skipped.
  - name: parity-decode-json-empty
    file: empty.json
    argocdMessage: Failed to unmarshal "empty.json"
    drydockMessage: "empty.json: decode JSON object failed"
  # YAML text in a .json file fails, even when it is a valid manifest.
  - name: parity-decode-json-yaml
    file: yaml-content.json
    argocdMessage: Failed to unmarshal "yaml-content.json"
    drydockMessage: "yaml-content.json: decode JSON object failed"
  # A YAML syntax error after a decoded object fails the source.
  - name: parity-decode-yaml-partial
    file: partial.yaml
    argocdMessage: Failed to unmarshal "partial.yaml"
    drydockMessage: "partial.yaml document 1: decode YAML document failed"
  # A document without a kind after a decoded object fails the source.
  - name: parity-decode-yaml-kindless
    file: kindless.yaml
    argocdMessage: Failed to unmarshal "kindless.yaml"
    drydockMessage: "kindless.yaml document 1 is missing kind"
  # A file whose first document stops the stream fails when the file text
  # holds all of "apiVersion:", "kind:" and "metadata:".
  - name: parity-decode-yaml-markers
    file: markers.yaml
    argocdMessage: Failed to unmarshal "markers.yaml"
    drydockMessage: "markers.yaml document 0 is missing kind"
  # A .json object without a kind passes the OCI image manifest test. The
  # repo-server emits it, and the controller fails because it has no kind.
  - name: parity-decode-json-package
    file: package.json
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"devDependencies\":{\"vite\":\"^5.4.0\"},\"metadata\":{\"annotations\":{\"argocd.argoproj.io/tracking-id\":"
    drydockMessage: "package.json: JSON object has no kind"
  # The same for an empty object.
  - name: parity-decode-json-object
    file: empty-object.json
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"metadata\":{\"annotations\":{\"argocd.argoproj.io/tracking-id\":"
    drydockMessage: "empty-object.json: JSON object has no kind"
  # A list item without a kind takes the same path. The repo-server splits
  # the list into its items and emits each one, even when the list itself
  # has no kind.
  - name: parity-decode-json-list-item
    file: kindless-list.json
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"data\":{\"note\":\"a list item without a kind\"},\"metadata\":{\"annotations\":{\"argocd.argoproj.io/tracking-id\":"
    drydockMessage: "kindless-list.json document 0 list item /items/0 has no kind"
  # The same for an item of a List in a YAML file.
  - name: parity-decode-yaml-list-item
    file: list.yaml
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"data\":{\"note\":\"a list item without a kind\"},\"metadata\":{\"annotations\":{\"argocd.argoproj.io/tracking-id\":\"parity-directory-decode_parity-decode-yaml-list-item:"
    drydockMessage: "list.yaml document 0 list item /items/0 has no kind"
  # Jsonnet output is decoded into Unstructured objects, and that decode
  # needs a kind. So a Jsonnet object without a kind fails in the repo-server.
  - name: parity-decode-jsonnet-kindless
    file: kindless.jsonnet
    argocdMessage: Failed to unmarshal generated json "kindless.jsonnet"
    drydockMessage: 'kindless.jsonnet": JSON object is missing kind'
  # A List from Jsonnet is split into its items like any other List. An item
  # without a kind fails in the controller.
  - name: parity-decode-jsonnet-list-item
    file: list.jsonnet
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"data\":{\"note\":\"a jsonnet list item without a kind\"},\"metadata\":{\"annotations\":{\"argocd.argoproj.io/tracking-id\":\"parity-directory-decode_parity-decode-jsonnet-list-item:"
    drydockMessage: "list.jsonnet output list item /items/0 has no kind"
  # A list item whose annotations are not a map fails when the repo-server
  # sets the tracking annotation.
  - name: parity-decode-yaml-tracking
    file: tracking.yaml
    argocdNamesObject: parity-decode-tracking-annotations
    argocdMessage: "failed to set app instance tracking info on manifest: failed to get annotations for /v1, Kind=ConfigMap parity-directory-decode-workloads/parity-decode-tracking-annotations"
    drydockMessage: "tracking.yaml document 0 list item /items/0: failed to set app instance tracking info on manifest"
  # Error order. a-scalar-item.json has a list item that is not an object,
  # which fails only after every file is read. b-invalid.json fails while it
  # is read, so Argo CD reports b-invalid.json although it comes later.
  - name: parity-decode-order-decode
    file: b-invalid.json
    argocdMessage: Failed to unmarshal "b-invalid.json"
    drydockMessage: "b-invalid.json: decode JSON object failed"
  # Error order. a-kindless.json fails in the controller. b-tracking.yaml
  # fails earlier, in the repo-server, so Argo CD reports b-tracking.yaml
  # although it comes later.
  - name: parity-decode-order-tracking
    file: b-tracking.yaml
    argocdNamesObject: parity-decode-order-tracking-annotations
    argocdMessage: "failed to set app instance tracking info on manifest: failed to get annotations for /v1, Kind=ConfigMap parity-directory-decode-workloads/parity-decode-order-tracking-annotations"
    drydockMessage: "b-tracking.yaml document 0 list item /items/0: failed to set app instance tracking info on manifest"
  # An apiVersion with two or more slashes does not parse as a group
  # version, so the Unstructured decode finds no kind. A .json object then
  # passes the OCI image manifest test, and the controller fails on it.
  - name: parity-decode-json-apiversion
    file: apiversion.json
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"apiVersion\":\"apps/v1/\",\"kind\":\"Deployment\",\"metadata\":{\"annotations\":{\"argocd.argoproj.io/tracking-id\":\"parity-directory-decode_parity-decode-json-apiversion:"
    drydockMessage: 'apiversion.json: JSON object has apiVersion "apps/v1/", which is not a valid group version, so it has no kind'
  # The same apiVersion in a YAML file stops the stream at the first
  # document, and the file text holds every manifest marker.
  - name: parity-decode-yaml-apiversion
    file: apiversion.yaml
    argocdMessage: Failed to unmarshal "apiversion.yaml"
    drydockMessage: 'apiversion.yaml document 0 has apiVersion "apps/v1/", which is not a valid group version, so it has no kind'
  # Helm output. Argo CD reads the output of helm template with
  # kube.SplitYAML, which decodes each document into an Unstructured object.
  # That decode fails on a document without a kind in the repo-server. The
  # message quotes the document as JSON with sorted keys, without tracking
  # metadata, and names no file.
  - name: parity-decode-helm-kindless
    source: helm
    file: templates/kindless.yaml
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"data\":{\"note\":\"a helm template without a kind\"},\"metadata\":{\"name\":\"parity-decode-helm-kindless-object\"}}'"
    drydockMessage: "templates/kindless.yaml document 0 has no kind"
  # kube.SplitYAML keeps an empty object and fails on it.
  - name: parity-decode-helm-empty-object
    source: helm
    file: templates/empty-object.yaml
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{}'"
    drydockMessage: "templates/empty-object.yaml document 0 has no kind"
  # An apiVersion with two slashes does not parse as a group version, so the
  # decode finds no kind.
  - name: parity-decode-helm-apiversion
    source: helm
    file: templates/deployment.yaml
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"apiVersion\":\"apps/v1/\",\"kind\":\"Deployment\",\"metadata\":{\"name\":\"parity-decode-helm-apiversion-object\"}}'"
    drydockMessage: 'templates/deployment.yaml document 0 has apiVersion "apps/v1/", which is not a valid group version, so it has no kind'
  # A List item without a kind passes the repo-server. GenerateManifests
  # emits it with tracking metadata, and the controller fails on it.
  - name: parity-decode-helm-list-item
    source: helm
    file: templates/list.yaml
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"data\":{\"note\":\"a helm list item without a kind\"},\"metadata\":{\"annotations\":{\"argocd.argoproj.io/tracking-id\":\"parity-directory-decode_parity-decode-helm-list-item:"
    drydockMessage: "templates/list.yaml document 0 list item /items/0 has no kind"
  # Kustomize output. kustomize keeps an apiVersion with two slashes, and
  # kube.SplitYAML fails on the build output. drydock names the
  # kustomization file and the document of the build output.
  - name: parity-decode-kustomize-apiversion
    source: kustomize
    file: kustomization.yaml
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{\"apiVersion\":\"apps/v1/\",\"kind\":\"Deployment\",\"metadata\":{\"name\":\"parity-decode-kustomize-apiversion-object\"}}'"
    drydockMessage: 'kustomization.yaml document 1 has apiVersion "apps/v1/", which is not a valid group version, so it has no kind'
  # Config management plugin output from the parity-env sidecar. The
  # cmp-server splits the output with kube.SplitYAMLToString, and the
  # repo-server decodes each document with kube.SplitYAML, which fails on the
  # empty object. file is the plugin program. drydock names the plugin
  # output, generate-output, instead.
  - name: parity-decode-plugin-empty-object
    source: plugin
    file: generate.awk
    argocdQuotesObject: true
    argocdMessage: "Object 'Kind' is missing in '{}'"
    drydockMessage: "plugin/parity-env/path/workloads/directory-decode/plugin-empty-object/generate-output document 1 has no kind"
  # An out-of-bounds symlink anywhere in a repository fails every
  # Application from it before the repo-server reads the source path
  # (runRepoOperation, reposerver/repository/repository.go:499-514, and
  # CheckOutOfBoundsSymlinks, util/app/path/path.go:51-110). The Application
  # renders from the oob-symlink repository, whose other/escape.yaml the
  # smoke creates as a symlink to /etc/hosts, outside the source path app.
  # argocd-cmd-params-cm does not set reposerver.allow.oob.symlinks.
  - name: parity-decode-oob-symlink
    repository: oob-symlink
    file: other/escape.yaml
    argocdMessage: "repository contains out-of-bounds symlinks. file: other/escape.yaml"
    drydockMessage: "repository contains out-of-bounds symlinks. file: other/escape.yaml"
  # Helm file parameters (source helm-file-parameters). The repo-server
  # resolves every fileParameters path before it runs helm, also a path that
  # a later entry with the same name overrides (helmTemplate,
  # reposerver/repository/repository.go:1361-1377). The resolver
  # (ResolveValueFilePathOrUrl, util/io/path/resolved.go:112-187) follows a
  # symlink at the path itself and joins its target to the directory of the
  # path as text. file-parameter-links/lexical-dir is a symlink to
  # targets/deep, and targets/deep/up.txt goes three directories up. From
  # targets/deep that stays in the repository, so the out-of-bounds check
  # passes, but from lexical-dir it leaves the repository root as text.
  - name: parity-decode-helm-fileparam-lexical-escape
    source: helm-file-parameters
    file: ../../../file-parameter-links/lexical-dir/up.txt
    argocdMessage: "error resolving helm value file path: file '../../../file-parameter-links/lexical-dir/up.txt' resolved to outside repository root"
    drydockMessage: "error resolving helm value file path: file '../../../file-parameter-links/lexical-dir/up.txt' resolved to outside repository root"
  # The same path fails when a later entry with the same name overrides it,
  # though helm never reads it. That entry reads a regular file.
  - name: parity-decode-helm-fileparam-overridden-escape
    source: helm-file-parameters
    file: ../../../file-parameter-links/lexical-dir/up.txt
    argocdMessage: "error resolving helm value file path: file '../../../file-parameter-links/lexical-dir/up.txt' resolved to outside repository root"
    drydockMessage: "error resolving helm value file path: file '../../../file-parameter-links/lexical-dir/up.txt' resolved to outside repository root"
  # A dangling symlink resolves to its missing target, and helm --set-file
  # fails to read it. The repo-server names the target under
  # "<path to cached source>", drydock under the repository root.
  - name: parity-decode-helm-fileparam-dangling
    source: helm-file-parameters
    file: file-parameter-links/missing-target.txt
    argocdMessage: "file-parameter-links/missing-target.txt: no such file or directory"
    drydockMessage: "file-parameter-links/missing-target.txt: no such file or directory"
  # A symlink to a directory resolves to the directory, which helm
  # --set-file cannot read.
  - name: parity-decode-helm-fileparam-directory
    source: helm-file-parameters
    file: file-parameter-links/targets
    argocdMessage: "file-parameter-links/targets: is a directory"
    drydockMessage: "file-parameter-links/targets: is a directory"
  # Kustomize helmCharts. kustomize loads the values.yaml of the chart when
  # the entry sets no valuesFile, and fails when the chart has none
  # (HelmChartInflationGeneratorPlugin.copyValuesFile at kustomize/api
  # v0.21.3). Argo CD names the file by its full path.
  - name: parity-decode-kustomize-helm-no-values
    source: kustomize
    file: charts/novalues/values.yaml
    fileMissing: true
    argocdMessage: "charts/novalues/values.yaml: no such file or directory"
    drydockMessage: 'values file "charts/novalues/values.yaml": file does not exist'
  # kustomize loads valuesFile as a file name and expands no glob.
  - name: parity-decode-kustomize-helm-values-glob
    source: kustomize
    file: values-*.yaml
    fileMissing: true
    argocdMessage: "values-*.yaml: no such file or directory"
    drydockMessage: 'read helm value file "values-*.yaml": file does not exist'
  # kustomize loads helmCharts values files with LoadRestrictionsRootOnly
  # unless kustomize.buildOptions sets --load-restrictor
  # LoadRestrictionsNone (fileloader.go:320-332 at kustomize/api v0.21.3).
  # Argo CD names absolute paths, drydock paths from the repository root.
  - name: parity-decode-kustomize-helm-values-outside-root
    source: render
    argocdMessage: "could not load additionalValuesFile: security; file '"
    drydockMessage: "could not load additionalValuesFile: security; file 'workloads/directory-decode/kustomize-helm-values-outside-root.yaml' is not in or below 'workloads/directory-decode/kustomize-helm-values-outside-root'"
  # A values file that is a directory fails in the file loader.
  - name: parity-decode-kustomize-helm-values-directory
    source: render
    argocdMessage: "kustomize-helm-values-directory/vals' must resolve to a file"
    drydockMessage: "'workloads/directory-decode/kustomize-helm-values-directory/vals' must resolve to a file"
  # Render cases have no failing file. helm or kustomize fails the render
  # with a message that names no file, and Argo CD reports a
  # ComparisonError.
  #
  # kustomize rejects a release name that helm would read as a flag
  # (HelmChartInflationGeneratorPlugin.validateArgs).
  - name: parity-decode-kustomize-helm-release-name-dash
    source: render
    argocdMessage: "releaseName must not start with '-', got \"-bad\""
    drydockMessage: "releaseName must not start with '-', got \"-bad\""
  # helm template checks the release name (availableName,
  # pkg/action/install.go:619-624 at helm v4.3.1). Argo CD passes
  # helm.releaseName, so 54 characters fail.
  - name: parity-decode-helm-release-name-long
    source: render
    argocdMessage: 'release name check failed: release name "parity-decode-helm-release-name-long-aaaaaaaaaaaaaaaaa": invalid release name, must match regex ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$ and the length must not be longer than 53'
    drydockMessage: 'release name check failed: release name "parity-decode-helm-release-name-long-aaaaaaaaaaaaaaaaa": invalid release name, must match regex ^[a-z0-9]([-a-z0-9]*[a-z0-9])?(\.[a-z0-9]([-a-z0-9]*[a-z0-9])?)*$ and the length must not be longer than 53'
  # Argo CD passes the release name as --name-template, and helm parses it
  # as a Go template (action.TemplateName).
  - name: parity-decode-helm-release-name-template
    source: render
    argocdMessage: 'template: name-template:1: unexpected "}" in operand'
    drydockMessage: 'template: name-template:1: unexpected "}" in operand'
  # Argo CD v3.6.1 accepts helm.version "", v3, and v4 (NewCmd,
  # util/helm/cmd.go:36-48).
  - name: parity-decode-helm-version
    source: render
    argocdMessage: "helm version 'v2' is not supported"
    drydockMessage: "failed to create new helm command: helm version 'v2' is not supported"
  # helm template renders only application charts (checkIfInstallable,
  # pkg/cmd/install.go:360-371 at helm v4.3.1).
  - name: parity-decode-helm-library
    source: render
    argocdMessage: library charts are not installable
    drydockMessage: library charts are not installable
  # The chart kubeVersion constraint must match the kube version
  # (renderResources, pkg/action/action.go:288-291 at helm v4.3.1). The
  # Application sets helm.kubeVersion, so both sides check v1.30.0.
  - name: parity-decode-helm-kube-version
    source: render
    argocdMessage: "chart requires kubeVersion: >=99.0.0-0 which is incompatible with Kubernetes v1.30.0"
    drydockMessage: "chart requires kubeVersion: >=99.0.0-0 which is incompatible with Kubernetes v1.30.0"
  # helm v4.3.1 loads a chart of apiVersion v3, but helm template renders
  # only v1 and v2 charts (Install.RunWithContext, pkg/action/install.go).
  - name: parity-decode-helm-chart-v3
    source: render
    argocdMessage: invalid chart apiVersion
    drydockMessage: invalid chart apiVersion
  # Spec cases have no failing file. The Argo CD controller checks the
  # sources of each Application before it renders anything
  # (ValidatePermissions, util/argo/argo.go:644-737 at v3.6.1). A failed
  # check sets an InvalidSpecError condition instead of a ComparisonError,
  # and drydock must fail the render with the same text.
  - name: parity-decode-spec-source-no-path
    source: spec
    argocdMessage: spec.source.repoURL and either spec.source.path or spec.source.chart are required
    drydockMessage: "invalid spec: spec.source.repoURL and either spec.source.path or spec.source.chart are required"
  # A multi-source entry may set ref alone, but it needs one of path,
  # chart, and ref. Argo CD ends the message with the source in protobuf
  # text form, and drydock names the source index.
  - name: parity-decode-spec-sources-no-ref
    source: spec
    argocdMessage: spec.source.repoURL and either source.path, source.chart, or source.ref are required for source
    drydockMessage: "sources[1]: invalid spec: spec.source.repoURL and either source.path, source.chart, or source.ref are required"
  - name: parity-decode-spec-chart-no-revision
    source: spec
    argocdMessage: spec.source.targetRevision is required if the manifest source is a helm chart
    drydockMessage: "invalid spec: spec.source.targetRevision is required if the manifest source is a helm chart"
  # An oci:// source follows the same rule, so Argo CD never pulls it.
  - name: parity-decode-spec-oci-no-path
    source: spec
    argocdMessage: spec.source.repoURL and either spec.source.path or spec.source.chart are required
    drydockMessage: "invalid spec: spec.source.repoURL and either spec.source.path or spec.source.chart are required"
  - name: parity-decode-spec-hydrator-no-branch
    source: spec
    argocdMessage: spec.sourceHydrator.syncSource.targetBranch is required
    drydockMessage: "invalid spec: spec.sourceHydrator.syncSource.targetBranch is required"
