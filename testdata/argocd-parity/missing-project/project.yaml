# The one AppProject of this fixture directory. With it, the repository
# declares AppProjects, so drydock reports a project that it does not
# declare with the actionable project.missing warning. The smoke applies it
# to Argo CD too, so both sides hold the same AppProjects apart from the
# built-in default project.
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: parity-missing-project-anchor
  namespace: argocd
spec:
  sourceRepos: ["*"]
  destinations:
    - server: "*"
      namespace: "*"
