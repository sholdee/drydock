apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: local-helm
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/example/portable-smoke
    targetRevision: main
    path: charts/local-helm
    helm:
      values: |
        value: baseline-helm
  destination:
    name: in-cluster
    namespace: local-helm
