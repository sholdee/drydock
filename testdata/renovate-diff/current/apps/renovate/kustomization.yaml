apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: renovate
components:
  - ../../components/namespace
  - ../../components/dragonfly
helmCharts:
  - name: renovate-operator
    repo: https://charts.example.test/renovate
    version: 4.8.1
    releaseName: renovate-operator
patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: renovate-operator
    patch: |-
      - op: add
        path: /spec/template/spec/containers/0/env
        value:
          - name: RENOVATE_LOG_LEVEL
            value: debug
