apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: directory-jsonnet-edges
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://example.invalid/directory-jsonnet.git
    targetRevision: main
    path: repo
    directory:
      recurse: true
      include: '{*.yaml,*.json,*.jsonnet}'
      exclude: skip.yaml
      jsonnet:
        extVars:
          - name: name
            value: jsonnet-edge
        tlas:
          - name: namespace
            value: directory-jsonnet
  destination:
    server: https://kubernetes.default.svc
    namespace: directory-jsonnet
