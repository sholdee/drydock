version: "2"

run:
  timeout: 5m

linters:
  enable:
    - asciicheck
    - bidichk
    - bodyclose
    - canonicalheader
    - copyloopvar
    - dupword
    - durationcheck
    - errcheck
    - errchkjson
    - errorlint
    - exhaustive
    - forbidigo
    - gocheckcompilerdirectives
    - gocritic
    - gocyclo
    - govet
    - ineffassign
    - intrange
    - misspell
    - modernize
    - makezero
    - nakedret
    - nilerr
    - nilnesserr
    - nilnil
    - nolintlint
    - prealloc
    - reassign
    - staticcheck
    - unconvert
    - unused
    - usetesting
    - usestdlibvars
    - wastedassign
    - whitespace
  settings:
    gocyclo:
      min-complexity: 15
    nolintlint:
      require-explanation: true
      require-specific: true
    errcheck:
      check-type-assertions: true
    forbidigo:
      # Matched against the real package path, so an import alias or another
      # package named yaml (sigs.k8s.io/yaml) neither hides nor trips it.
      analyze-types: true
      forbid:
        - pattern: ^yaml\.(Marshal|NewEncoder)$
          pkg: ^(go\.yaml\.in/yaml/v3|gopkg\.in/yaml\.v3)$
          msg: >-
            encode YAML with internal/format (format.YAML, format.MarshalYAML):
            at yaml.v3's default 4-space indent a list-nested block scalar whose
            text starts with a newline or a space does not read back intact
  exclusions:
    presets:
      - std-error-handling
    rules:
      - linters:
          - modernize
        text: "omitzero:"
      # The 2-space encoder every other package uses.
      - path: ^internal/format/format\.go$
        linters:
          - forbidigo

formatters:
  enable:
    - gofmt
  settings:
    gofmt:
      simplify: true
