baseURL: "https://sholdee.github.io/drydock/"
title: "drydock"
locale: "en-US"
disableKinds:
  - taxonomy
  - term

params:
  description: "Offline desired-state analysis for Argo CD GitOps repositories."

menus:
  docs:
    - name: Overview
      url: /
      weight: 10
    - name: Getting Started
      url: /getting-started/
      weight: 20
    - name: GitHub Actions
      url: /workflows/github-actions/
      weight: 30
    - name: Local Diffs
      url: /workflows/local-diffs/
      weight: 40
    - name: Troubleshooting
      url: /troubleshooting/
      weight: 50
    - name: Runtime Offline
      url: /concepts/runtime-offline/
      weight: 60
    - name: Source Acquisition
      url: /concepts/source-acquisition/
      weight: 70
    - name: Changed-Only Diffs
      url: /concepts/changed-only/
      weight: 80
    - name: Compatibility
      url: /compatibility/
      weight: 90
    - name: Plugin Policy
      url: /plugin-policy/
      weight: 100
    - name: Reference
      url: /reference/
      weight: 110

markup:
  tableOfContents:
    startLevel: 2
    endLevel: 3
    ordered: false

module:
  mounts:
    - source: content
      target: content
    - source: ../docs
      target: content/docs
    - source: layouts
      target: layouts
    - source: assets
      target: assets
    - source: static
      target: static
    - source: ../docs/logo
      target: static/logo
    - source: ../schemas
      target: static/schemas
